name: WiFiMapper
options:
  bundleIdPrefix: com.ravitej
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    exactVersion: 13.11.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here, or pick it in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: F5D5362ZUD

targets:
  WiFiMapper:
    type: application
    platform: iOS
    sources:
      - WiFiMapper
    dependencies:
      - package: GoogleMobileAds
    entitlements:
      path: WiFiMapper/WiFiMapper.entitlements
      properties:
        # "Access Wi-Fi Information" — needed for SSID, BSSID and signalStrength.
        com.apple.developer.networking.wifi-info: true
    info:
      path: WiFiMapper/Info.plist
      properties:
        CFBundleDisplayName: WiFi Mapper
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: >-
          WiFi Mapper uses your precise location to place each Wi-Fi reading on the map.
          iOS also requires location access to read the name of the Wi-Fi network you're on.
        NSLocationTemporaryUsageDescriptionDictionary:
          WiFiMapping: Precise location is needed to build an accurate Wi-Fi heatmap of your property.
        NSLocalNetworkUsageDescription: >-
          WiFi Mapper measures latency to your router to estimate Wi-Fi link quality.
        UIBackgroundModes:
          - location
        # Google's sample AdMob app ID. Replace with your AdMob app ID before release.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        NSUserTrackingUsageDescription: >-
          Your choice lets Google show ads that are more relevant to you. WiFi Mapper works the same either way.
        # Google's list from https://developers.google.com/admob/ios/quick-start (Google first, then
        # third-party buyers). Re-check it when updating the SDK; the SDK logs any that are missing.
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
