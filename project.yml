    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravitej.wifimapper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: WiFi Mapper

  WiFiMapperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WiFiMapperTests
    dependencies:
      - target: WiFiMapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ravitej.wifimapper.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WiFiMapper:
    build:
      targets:
        WiFiMapper: all
        WiFiMapperTests: [test]
    run:
      config: Debug
      # Local "Remove ads" product so purchases can be tested from Xcode without App Store Connect.
      storeKitConfiguration: WiFiMapper.storekit
    test:
      config: Debug
      targets:
        - WiFiMapperTests
